<title>Intel Price in Euros</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: one centered column — price header, range switch, full-width chart, source line */
:root {
  --bg: #f6f8fb; --surface: #ffffff; --fg: #14202e; --muted: #5b6b7d; --grid: #e3e8ef;
  --line: #0a68b8; --fill: rgba(10,104,184,.10); --up: #1a7f4b; --down: #c0392b;
  --sans: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0e141b; --surface: #151d27; --fg: #e6edf5; --muted: #8f9fb1; --grid: #243041;
  --line: #4ea3ec; --fill: rgba(78,163,236,.14); --up: #4cc38a; --down: #f0776a; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #0e141b; --surface: #151d27; --fg: #e6edf5; --muted: #8f9fb1; --grid: #243041;
  --line: #4ea3ec; --fill: rgba(78,163,236,.14); --up: #4cc38a; --down: #f0776a; color-scheme: dark }

body { background: var(--bg); color: var(--fg); font-family: var(--sans); }
.wrap { max-width: 960px; margin: 0 auto; padding-inline: 16px; padding-block: 32px 40px; display: grid; gap: 20px; }
header { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: end; gap: 16px; }
.ticker { font: 500 12px/1 var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
h1 { margin: 6px 0 0; font-size: 22px; font-weight: 600; text-wrap: balance; }
.price { font: 500 40px/1.1 var(--mono); font-variant-numeric: tabular-nums; margin-top: 10px; }
.price small { font-size: 18px; color: var(--muted); margin-left: 4px; }
.chg { font: 500 14px var(--mono); font-variant-numeric: tabular-nums; margin-top: 4px; }
.chg.up { color: var(--up); } .chg.down { color: var(--down); }
.chg span { color: var(--muted); font-family: var(--sans); font-weight: 400; }
.ranges { display: flex; gap: 2px; background: var(--grid); padding: 3px; border-radius: 8px; }
.ranges button { font: 500 13px var(--mono); border: 0; background: transparent; color: var(--muted);
  padding: 6px 12px; border-radius: 6px; cursor: pointer; }
.ranges button[aria-pressed="true"] { background: var(--surface); color: var(--fg); }
.ranges button:focus-visible { outline: 2px solid var(--line); outline-offset: 1px; }
.chart { background: var(--surface); border-radius: 12px; padding: 12px 8px 4px; position: relative; }
svg { display: block; width: 100%; height: 360px; touch-action: none; }
.axis text { font: 11px var(--mono); fill: var(--muted); font-variant-numeric: tabular-nums; }
.tip { position: absolute; pointer-events: none; background: var(--fg); color: var(--bg); font: 12px var(--mono);
  padding: 6px 8px; border-radius: 6px; white-space: nowrap; transform: translate(-50%, -100%); }
.tip b { font-weight: 500; font-size: 14px; display: block; }
footer { font-size: 12px; color: var(--muted); }
@media (max-width: 480px) { .price { font-size: 32px; } svg { height: 280px; } }
</style>

<div class="wrap">
  <header>
    <div>
      <div class="ticker">NASDAQ: INTC · converted to EUR</div>
      <h1>Intel share price</h1>
      <div class="price" id="price"></div>
      <div class="chg" id="chg"></div>
    </div>
    <div class="ranges" role="group" aria-label="Time range" id="ranges">
      <button id="r1m" data-d="21">1M</button>
      <button id="r6m" data-d="126">6M</button>
      <button id="r1y" data-d="252" aria-pressed="true">1Y</button>
      <button id="r5y" data-d="99999">5Y</button>
    </div>
  </header>
  <div class="chart">
    <svg id="svg" role="img" aria-label="Line chart of the Intel share price in euros"></svg>
    <div class="tip" id="tip" hidden></div>
  </div>
  <footer id="foot"></footer>
</div>

<script>
const DATA = __DATA__;
const ALL = DATA.points.map(([d, v]) => ({ d: new Date(d + "T00:00:00Z"), v }));
const svg = document.getElementById("svg"), tip = document.getElementById("tip");
const NS = "http://www.w3.org/2000/svg";
const eur = v => v.toLocaleString("de-DE", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const fmtDay = d => d.toLocaleDateString("en-GB", { day: "numeric", month: "short", year: "numeric", timeZone: "UTC" });
let days = 252;
try { days = +localStorage.getItem("intc-range") || 252; } catch (e) {}

document.getElementById("foot").textContent =
  `Daily close of INTC (USD) divided by the EUR/USD rate on the same day. Source: Yahoo Finance via yfinance. Updated ${DATA.updated}.`;

function el(tag, attrs, parent) {
  const n = document.createElementNS(NS, tag);
  for (const k in attrs) n.setAttribute(k, attrs[k]);
  parent && parent.appendChild(n);
  return n;
}

function niceTicks(lo, hi, n) {
  const step0 = (hi - lo) / n, mag = 10 ** Math.floor(Math.log10(step0));
  const step = [1, 2, 2.5, 5, 10].map(m => m * mag).find(s => s >= step0);
  const out = [];
  for (let t = Math.ceil(lo / step) * step; t <= hi + 1e-9; t += step) out.push(+t.toFixed(6));
  return out;
}

function draw() {
  const pts = ALL.slice(-days);
  const first = pts[0], last = pts[pts.length - 1];
  document.getElementById("price").innerHTML = `${eur(last.v)}<small>€</small>`;
  const diff = last.v - first.v, pct = diff / first.v * 100;
  const chg = document.getElementById("chg");
  chg.className = "chg " + (diff >= 0 ? "up" : "down");
  chg.innerHTML = `${diff >= 0 ? "▲ +" : "▼ "}${eur(diff)} € (${pct >= 0 ? "+" : ""}${pct.toFixed(1)}%) <span>since ${fmtDay(first.d)}</span>`;
  document.querySelectorAll("#ranges button").forEach(b => b.setAttribute("aria-pressed", +b.dataset.d === days));

  const W = svg.clientWidth, H = svg.clientHeight, m = { t: 12, r: 12, b: 26, l: 48 };
  svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
  svg.replaceChildren();
  let lo = Math.min(...pts.map(p => p.v)), hi = Math.max(...pts.map(p => p.v));
  const pad = (hi - lo) * 0.08 || 1; lo -= pad; hi += pad;
  const t0 = +first.d, t1 = +last.d;
  const x = t => m.l + (t - t0) / (t1 - t0 || 1) * (W - m.l - m.r);
  const y = v => m.t + (hi - v) / (hi - lo) * (H - m.t - m.b);

  const ax = el("g", { class: "axis" }, svg);
  for (const t of niceTicks(lo, hi, 5)) {
    el("line", { x1: m.l, x2: W - m.r, y1: y(t), y2: y(t), stroke: "var(--grid)" }, ax);
    el("text", { x: m.l - 8, y: y(t) + 4, "text-anchor": "end" }, ax).textContent = t;
  }
  const spanDays = (t1 - t0) / 864e5, nX = Math.max(2, Math.floor((W - m.l - m.r) / 110));
  for (let i = 0; i <= nX; i++) {
    const d = new Date(t0 + (t1 - t0) * i / nX);
    const label = spanDays < 70 ? d.toLocaleDateString("en-GB", { day: "numeric", month: "short", timeZone: "UTC" })
                                : d.toLocaleDateString("en-GB", { month: "short", year: "2-digit", timeZone: "UTC" });
    el("text", { x: x(+d), y: H - 6, "text-anchor": i === 0 ? "start" : i === nX ? "end" : "middle" }, ax).textContent = label;
  }

  const path = pts.map((p, i) => `${i ? "L" : "M"}${x(+p.d).toFixed(1)},${y(p.v).toFixed(1)}`).join("");
  el("path", { d: `${path}L${x(t1)},${H - m.b}L${x(t0)},${H - m.b}Z`, fill: "var(--fill)" }, svg);
  el("path", { d: path, fill: "none", stroke: "var(--line)", "stroke-width": 2, "stroke-linejoin": "round" }, svg);
  el("circle", { cx: x(t1), cy: y(last.v), r: 4.5, fill: "var(--line)", stroke: "var(--surface)", "stroke-width": 2 }, svg);

  const cross = el("line", { y1: m.t, y2: H - m.b, stroke: "var(--muted)", "stroke-dasharray": "3 3", visibility: "hidden" }, svg);
  const dot = el("circle", { r: 5, fill: "var(--line)", stroke: "var(--surface)", "stroke-width": 2, visibility: "hidden" }, svg);
  const hit = el("rect", { x: m.l, y: 0, width: W - m.l - m.r, height: H, fill: "transparent" }, svg);
  const move = e => {
    const r = svg.getBoundingClientRect(), px = e.clientX - r.left;
    const t = t0 + (px - m.l) / (W - m.l - m.r) * (t1 - t0);
    let i = pts.findIndex(p => +p.d >= t); if (i < 0) i = pts.length - 1;
    if (i > 0 && t - +pts[i - 1].d < +pts[i].d - t) i--;
    const p = pts[i], cx = x(+p.d), cy = y(p.v);
    cross.setAttribute("x1", cx); cross.setAttribute("x2", cx);
    dot.setAttribute("cx", cx); dot.setAttribute("cy", cy);
    cross.setAttribute("visibility", "visible"); dot.setAttribute("visibility", "visible");
    tip.hidden = false;
    tip.innerHTML = `<b>${eur(p.v)} €</b>${fmtDay(p.d)}`;
    tip.style.left = (svg.offsetLeft + Math.min(Math.max(cx, 60), W - 60)) + "px";
    tip.style.top = (svg.offsetTop + cy - 10) + "px";
  };
  const leave = () => { tip.hidden = true; cross.setAttribute("visibility", "hidden"); dot.setAttribute("visibility", "hidden"); };
  hit.addEventListener("pointermove", move);
  hit.addEventListener("pointerdown", move);
  hit.addEventListener("pointerleave", leave);
}

document.getElementById("ranges").addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  days = +b.dataset.d;
  try { localStorage.setItem("intc-range", days); } catch (err) {}
  draw();
});
addEventListener("resize", draw);
draw();
</script>
