<title>Intel Price in Euros</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: one centered column — price header, range switch, full-width chart, source line */
:root {
  --bg: #f6f8fb; --surface: #ffffff; --fg: #14202e; --muted: #5b6b7d; --grid: #e3e8ef;
  --line: #0a68b8; --fill: rgba(10,104,184,.10); --up: #1a7f4b; --down: #c0392b;
  --sans: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0e141b; --surface: #151d27; --fg: #e6edf5; --muted: #8f9fb1; --grid: #243041;
  --line: #4ea3ec; --fill: rgba(78,163,236,.14); --up: #4cc38a; --down: #f0776a; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #0e141b; --surface: #151d27; --fg: #e6edf5; --muted: #8f9fb1; --grid: #243041;
  --line: #4ea3ec; --fill: rgba(78,163,236,.14); --up: #4cc38a; --down: #f0776a; color-scheme: dark }

body { background: var(--bg); color: var(--fg); font-family: var(--sans); }
.wrap { max-width: 960px; margin: 0 auto; padding-inline: 16px; padding-block: 32px 40px; display: grid; gap: 20px; }
header { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: end; gap: 16px; }
.ticker { font: 500 12px/1 var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
h1 { margin: 6px 0 0; font-size: 22px; font-weight: 600; text-wrap: balance; }
.price { font: 500 40px/1.1 var(--mono); font-variant-numeric: tabular-nums; margin-top: 10px; }
.price small { font-size: 18px; color: var(--muted); margin-left: 4px; }
.chg { font: 500 14px var(--mono); font-variant-numeric: tabular-nums; margin-top: 4px; }
.chg.up { color: var(--up); } .chg.down { color: var(--down); }
.chg span { color: var(--muted); font-family: var(--sans); font-weight: 400; }
.ranges { display: flex; gap: 2px; background: var(--grid); padding: 3px; border-radius: 8px; }
.ranges button { font: 500 13px var(--mono); border: 0; background: transparent; color: var(--muted);
  padding: 6px 12px; border-radius: 6px; cursor: pointer; }
.ranges button[aria-pressed="true"] { background: var(--surface); color: var(--fg); }
.ranges button:focus-visible { outline: 2px solid var(--line); outline-offset: 1px; }
.chart { background: var(--surface); border-radius: 12px; padding: 12px 8px 4px; position: relative; }
svg { display: block; width: 100%; height: 360px; touch-action: none; }
.axis text { font: 11px var(--mono); fill: var(--muted); font-variant-numeric: tabular-nums; }
.tip { position: absolute; pointer-events: none; background: var(--fg); color: var(--bg); font: 12px var(--mono);
  padding: 6px 8px; border-radius: 6px; white-space: nowrap; transform: translate(-50%, -100%); }
.tip b { font-weight: 500; font-size: 14px; display: block; }
footer { font-size: 12px; color: var(--muted); }
.main { display: grid; grid-template-columns: minmax(0, 1fr) 260px; gap: 16px; align-items: start; }
.bill { background: var(--surface); border-radius: 12px; padding: 16px; display: grid; gap: 12px; min-width: 0; }
.bill h2 { margin: 0; font: 500 12px/1 var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.drop { border: 1.5px dashed var(--grid); border-radius: 10px; padding: 18px 12px; text-align: center; cursor: pointer;
  color: var(--muted); font-size: 13px; line-height: 1.4; }
.drop:hover, .drop.over { border-color: var(--line); color: var(--fg); }
.drop:focus-within { outline: 2px solid var(--line); outline-offset: 2px; }
.drop strong { color: var(--line); font-weight: 600; }
.drop input { position: absolute; width: 1px; height: 1px; opacity: 0; }
.status { font-size: 13px; color: var(--muted); }
.status.err { color: var(--down); }
.sum { font: 500 30px/1.1 var(--mono); font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.sum small { font-size: 15px; color: var(--muted); margin-left: 3px; }
.meta { font-size: 12px; color: var(--muted); display: grid; gap: 6px; overflow-wrap: anywhere; }
.meta code { font: 11px var(--mono); background: var(--bg); padding: 2px 4px; border-radius: 4px; }
.shares { font-size: 13px; }
.shares b { font-family: var(--mono); font-weight: 500; }
.fix { display: flex; gap: 6px; align-items: center; font-size: 12px; color: var(--muted); }
.fix input { width: 100%; min-width: 0; font: 13px var(--mono); padding: 5px 7px; border: 1px solid var(--grid);
  border-radius: 6px; background: var(--bg); color: var(--fg); }
.fix input:focus-visible { outline: 2px solid var(--line); outline-offset: 0; }
.note { font-size: 11px; color: var(--muted); margin: 0; }
@media (max-width: 760px) { .main { grid-template-columns: 1fr; } }
@media (max-width: 480px) { .price { font-size: 32px; } svg { height: 280px; } }
</style>

<div class="wrap">
  <header>
    <div>
      <div class="ticker">NASDAQ: INTC · converted to EUR</div>
      <h1>Intel share price</h1>
      <div class="price" id="price"></div>
      <div class="chg" id="chg"></div>
    </div>
    <div class="ranges" role="group" aria-label="Time range" id="ranges">
      <button id="r1m" data-d="21">1M</button>
      <button id="r6m" data-d="126">6M</button>
      <button id="r1y" data-d="252" aria-pressed="true">1Y</button>
      <button id="r5y" data-d="99999">5Y</button>
    </div>
  </header>
  <div class="main">
    <div class="chart">
      <svg id="svg" role="img" aria-label="Line chart of the Intel share price in euros"></svg>
      <div class="tip" id="tip" hidden></div>
    </div>
    <aside class="bill" aria-labelledby="billTitle">
      <h2 id="billTitle">Bill total</h2>
      <label class="drop" id="drop">
        <input type="file" id="billFile" accept="application/pdf,.pdf">
        <strong>Upload a PDF bill</strong><br>or drop it here
      </label>
      <div class="status" id="billStatus" aria-live="polite">No bill yet. Scanned and digital PDFs both work.</div>
      <div id="billResult" hidden>
        <div class="sum" id="billSum"></div>
        <div class="shares" id="billShares"></div>
        <div class="meta" id="billMeta"></div>
        <label class="fix" for="billFix">Correct:
          <input type="text" id="billFix" inputmode="decimal" autocomplete="off">
        </label>
      </div>
      <p class="note">The PDF is read in your browser and is never uploaded.</p>
    </aside>
  </div>
  <footer id="foot"></footer>
</div>

<script>
const DATA = __DATA__;
const ALL = DATA.points.map(([d, v]) => ({ d: new Date(d + "T00:00:00Z"), v }));
const svg = document.getElementById("svg"), tip = document.getElementById("tip");
const NS = "http://www.w3.org/2000/svg";
const eur = v => v.toLocaleString("de-DE", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const fmtDay = d => d.toLocaleDateString("en-GB", { day: "numeric", month: "short", year: "numeric", timeZone: "UTC" });
let days = 252;
try { days = +localStorage.getItem("intc-range") || 252; } catch (e) {}

document.getElementById("foot").textContent =
  `Daily close of INTC (USD) divided by the EUR/USD rate on the same day. Source: Yahoo Finance via yfinance. Updated ${DATA.updated}.`;

function el(tag, attrs, parent) {
  const n = document.createElementNS(NS, tag);
  for (const k in attrs) n.setAttribute(k, attrs[k]);
  parent && parent.appendChild(n);
  return n;
}

function niceTicks(lo, hi, n) {
  const step0 = (hi - lo) / n, mag = 10 ** Math.floor(Math.log10(step0));
  const step = [1, 2, 2.5, 5, 10].map(m => m * mag).find(s => s >= step0);
  const out = [];
  for (let t = Math.ceil(lo / step) * step; t <= hi + 1e-9; t += step) out.push(+t.toFixed(6));
  return out;
}

function draw() {
  const pts = ALL.slice(-days);
  const first = pts[0], last = pts[pts.length - 1];
  document.getElementById("price").innerHTML = `${eur(last.v)}<small>€</small>`;
  const diff = last.v - first.v, pct = diff / first.v * 100;
  const chg = document.getElementById("chg");
  chg.className = "chg " + (diff >= 0 ? "up" : "down");
  chg.innerHTML = `${diff >= 0 ? "▲ +" : "▼ "}${eur(diff)} € (${pct >= 0 ? "+" : ""}${pct.toFixed(1)}%) <span>since ${fmtDay(first.d)}</span>`;
  document.querySelectorAll("#ranges button").forEach(b => b.setAttribute("aria-pressed", +b.dataset.d === days));

  const W = svg.clientWidth, H = svg.clientHeight, m = { t: 12, r: 12, b: 26, l: 48 };
  svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
  svg.replaceChildren();
  let lo = Math.min(...pts.map(p => p.v)), hi = Math.max(...pts.map(p => p.v));
  const pad = (hi - lo) * 0.08 || 1; lo -= pad; hi += pad;
  const t0 = +first.d, t1 = +last.d;
  const x = t => m.l + (t - t0) / (t1 - t0 || 1) * (W - m.l - m.r);
  const y = v => m.t + (hi - v) / (hi - lo) * (H - m.t - m.b);

  const ax = el("g", { class: "axis" }, svg);
  for (const t of niceTicks(lo, hi, 5)) {
    el("line", { x1: m.l, x2: W - m.r, y1: y(t), y2: y(t), stroke: "var(--grid)" }, ax);
    el("text", { x: m.l - 8, y: y(t) + 4, "text-anchor": "end" }, ax).textContent = t;
  }
  const spanDays = (t1 - t0) / 864e5, nX = Math.max(2, Math.floor((W - m.l - m.r) / 110));
  for (let i = 0; i <= nX; i++) {
    const d = new Date(t0 + (t1 - t0) * i / nX);
    const label = spanDays < 70 ? d.toLocaleDateString("en-GB", { day: "numeric", month: "short", timeZone: "UTC" })
                                : d.toLocaleDateString("en-GB", { month: "short", year: "2-digit", timeZone: "UTC" });
    el("text", { x: x(+d), y: H - 6, "text-anchor": i === 0 ? "start" : i === nX ? "end" : "middle" }, ax).textContent = label;
  }

  const path = pts.map((p, i) => `${i ? "L" : "M"}${x(+p.d).toFixed(1)},${y(p.v).toFixed(1)}`).join("");
  el("path", { d: `${path}L${x(t1)},${H - m.b}L${x(t0)},${H - m.b}Z`, fill: "var(--fill)" }, svg);
  el("path", { d: path, fill: "none", stroke: "var(--line)", "stroke-width": 2, "stroke-linejoin": "round" }, svg);
  el("circle", { cx: x(t1), cy: y(last.v), r: 4.5, fill: "var(--line)", stroke: "var(--surface)", "stroke-width": 2 }, svg);

  const cross = el("line", { y1: m.t, y2: H - m.b, stroke: "var(--muted)", "stroke-dasharray": "3 3", visibility: "hidden" }, svg);
  const dot = el("circle", { r: 5, fill: "var(--line)", stroke: "var(--surface)", "stroke-width": 2, visibility: "hidden" }, svg);
  const hit = el("rect", { x: m.l, y: 0, width: W - m.l - m.r, height: H, fill: "transparent" }, svg);
  const move = e => {
    const r = svg.getBoundingClientRect(), px = e.clientX - r.left;
    const t = t0 + (px - m.l) / (W - m.l - m.r) * (t1 - t0);
    let i = pts.findIndex(p => +p.d >= t); if (i < 0) i = pts.length - 1;
    if (i > 0 && t - +pts[i - 1].d < +pts[i].d - t) i--;
    const p = pts[i], cx = x(+p.d), cy = y(p.v);
    cross.setAttribute("x1", cx); cross.setAttribute("x2", cx);
    dot.setAttribute("cx", cx); dot.setAttribute("cy", cy);
    cross.setAttribute("visibility", "visible"); dot.setAttribute("visibility", "visible");
    tip.hidden = false;
    tip.innerHTML = `<b>${eur(p.v)} €</b>${fmtDay(p.d)}`;
    tip.style.left = (svg.offsetLeft + Math.min(Math.max(cx, 60), W - 60)) + "px";
    tip.style.top = (svg.offsetTop + cy - 10) + "px";
  };
  const leave = () => { tip.hidden = true; cross.setAttribute("visibility", "hidden"); dot.setAttribute("visibility", "hidden"); };
  hit.addEventListener("pointermove", move);
  hit.addEventListener("pointerdown", move);
  hit.addEventListener("pointerleave", leave);
}

/* ---------- Bill upload: read PDF text (OCR for scans) and find the total ---------- */
const PDFJS = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/";
const TESSERACT = "https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js";
const MAX_OCR_PAGES = 3;
const $ = id => document.getElementById(id);

function loadScript(src) {
  return new Promise((ok, fail) => {
    if (document.querySelector(`script[src="${src}"]`)) return ok();
    const s = document.createElement("script");
    s.src = src; s.onload = ok; s.onerror = () => fail(new Error("Could not load " + src));
    document.head.appendChild(s);
  });
}

// Amounts like 1.234,56 / 1,234.56 / 12,50 / 99.90 — not dates (09.10.2026) or percentages
const AMOUNT = /(?<![\d.,])(\d{1,3}(?:[.,' ]\d{3})+|\d+)[.,](\d{2})(?![.,]?\d)(?!\s*%)/g;
const STRONG = /(gesamtbetrag|rechnungsbetrag|endbetrag|zahlbetrag|zu zahlen|gesamtsumme|bruttobetrag|summe brutto|gesamt brutto|total due|amount due|balance due|grand total)/i;
const MEDIUM = /(gesamt|summe|total|betrag|brutto)/i;
const WEAK = /(netto|zwischensumme|subtotal|mwst|ust\b|steuer|tax|rabatt|discount)/i;

function amountsIn(line) {
  return [...line.matchAll(AMOUNT)].map(m => +(m[1].replace(/[.,' ]/g, "") + "." + m[2]));
}

function findTotal(text) {
  const lines = text.split(/\r?\n/).map(l => l.trim()).filter(Boolean);
  let best = null;
  lines.forEach((line, i) => {
    const strong = STRONG.test(line);
    let score = strong ? 3 : MEDIUM.test(line) ? 2 : 0;
    if (!score) return;
    if (!strong && WEAK.test(line)) score = 1;
    // OCR often puts the amount on the line after the label
    let nums = amountsIn(line), src = line;
    if (!nums.length && lines[i + 1]) { nums = amountsIn(lines[i + 1]); src = line + " " + lines[i + 1]; }
    for (const v of nums) {
      if (!best || score > best.score || (score === best.score && v > best.value)) best = { value: v, line: src, score };
    }
  });
  if (best) return best;
  const all = lines.flatMap(l => amountsIn(l).map(v => ({ value: v, line: l, score: 0 })));
  return all.sort((a, b) => b.value - a.value)[0] || null;
}

async function readPdf(file, status) {
  await loadScript(PDFJS + "pdf.min.js");
  pdfjsLib.GlobalWorkerOptions.workerSrc = PDFJS + "pdf.worker.min.js";
  const pdf = await pdfjsLib.getDocument({ data: await file.arrayBuffer() }).promise;

  status("Reading text…");
  let text = "";
  for (let p = 1; p <= pdf.numPages; p++) {
    const tc = await (await pdf.getPage(p)).getTextContent();
    text += tc.items.map(it => it.str + (it.hasEOL ? "\n" : " ")).join("") + "\n";
  }
  if (text.replace(/\s/g, "").length > 30) return { text, ocr: false };

  // No text layer, so it's a scan: render pages and run OCR
  status("Scanned PDF, loading text recognition…");
  await loadScript(TESSERACT);
  const pages = Math.min(pdf.numPages, MAX_OCR_PAGES);
  let page = 1;
  const worker = await Tesseract.createWorker("deu+eng", 1, {
    logger: m => { if (m.status === "recognizing text") status(`Recognizing text, page ${page}/${pages}… ${Math.round(m.progress * 100)}%`); }
  });
  try {
    for (; page <= pages; page++) {
      const pg = await pdf.getPage(page), vp = pg.getViewport({ scale: 2 });
      const canvas = document.createElement("canvas");
      canvas.width = vp.width; canvas.height = vp.height;
      await pg.render({ canvasContext: canvas.getContext("2d"), viewport: vp }).promise;
      text += (await worker.recognize(canvas)).data.text + "\n";
    }
  } finally { await worker.terminate(); }
  return { text, ocr: true };
}

function showBill(bill) {
  $("billResult").hidden = false;
  $("billSum").innerHTML = `${eur(bill.value)}<small>€</small>`;
  const price = ALL[ALL.length - 1].v;
  $("billShares").innerHTML = `≈ <b>${(bill.value / price).toLocaleString("de-DE", { maximumFractionDigits: 2 })}</b> Intel shares at ${eur(price)} €`;
  $("billMeta").innerHTML = "";
  const add = (label, val) => {
    const d = document.createElement("div");
    d.textContent = label + " ";
    if (val) { const c = document.createElement("code"); c.textContent = val; d.appendChild(c); }
    $("billMeta").appendChild(d);
  };
  add(bill.name);
  if (bill.edited) add("Corrected by hand");
  else if (bill.line) add(bill.score ? "Found in:" : "No total label found, largest amount:", bill.line.slice(0, 120));
  $("billFix").value = bill.value.toFixed(2).replace(".", ",");
  try { localStorage.setItem("intc-bill", JSON.stringify(bill)); } catch (e) {}
}

async function handleFile(file) {
  if (!file) return;
  const st = $("billStatus");
  const status = msg => { st.className = "status"; st.textContent = msg; };
  if (!/\.pdf$/i.test(file.name) && file.type !== "application/pdf") {
    st.className = "status err"; st.textContent = "That isn't a PDF. Choose a .pdf file."; return;
  }
  status("Opening PDF…");
  try {
    const { text, ocr } = await readPdf(file, status);
    const total = findTotal(text);
    if (!total) {
      st.className = "status err";
      st.textContent = "No amount found in this PDF. Type the total into the box below.";
      showBill({ name: file.name, value: 0, line: "", score: 0, edited: true });
      return;
    }
    status(ocr ? "Done. Read from the scan, so check the amount." : "Done.");
    showBill({ name: file.name, ...total, edited: false });
  } catch (err) {
    st.className = "status err";
    st.textContent = "Couldn't read this PDF (" + err.message + "). Try another file.";
  }
}

$("billFile").addEventListener("change", e => handleFile(e.target.files[0]));
const drop = $("drop");
drop.addEventListener("dragover", e => { e.preventDefault(); drop.classList.add("over"); });
drop.addEventListener("dragleave", () => drop.classList.remove("over"));
drop.addEventListener("drop", e => { e.preventDefault(); drop.classList.remove("over"); handleFile(e.dataTransfer.files[0]); });
$("billFix").addEventListener("change", e => {
  const v = amountsIn(e.target.value.trim() + (/[.,]\d{2}$/.test(e.target.value.trim()) ? "" : ",00"))[0];
  if (v === undefined) return;
  let bill = {};
  try { bill = JSON.parse(localStorage.getItem("intc-bill")) || {}; } catch (err) {}
  showBill({ name: bill.name || "Manual entry", value: v, line: "", score: 0, edited: true });
});
try {
  const saved = JSON.parse(localStorage.getItem("intc-bill"));
  if (saved) { showBill(saved); $("billStatus").textContent = "Last bill you uploaded on this device."; }
} catch (e) {}

document.getElementById("ranges").addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  days = +b.dataset.d;
  try { localStorage.setItem("intc-range", days); } catch (err) {}
  draw();
});
addEventListener("resize", draw);
draw();
</script>
